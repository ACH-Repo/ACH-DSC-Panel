[build-system]
# 77 for the SPDX `license` and `license-files` (PEP 639): the old table
# form and the licence classifier are deprecated.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# "ach-dsc-panel" (DSC-Panel) until 1.0.0, which was not on PyPI; Triplot
# since 1.1.0. The import name stays `dscpanel`.
name = "triplot"
dynamic = ["version"]
description = "An interactive panel for stacked DSC scans from TA Instruments TRIOS files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christian Nelle" }]
keywords = ["dsc", "calorimetry", "trios", "ta instruments", "thermal analysis",
            "plotting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "numpy",
    # Essentials, not "PySide6": QtCore, QtGui, QtWidgets and QtSvg are all
    # it uses, about 215 MB installed; the full PySide6 adds PySide6-Addons
    # (WebEngine, 3D, Charts, ...), another 460 MB (PySide6 6.11).
    "PySide6-Essentials",
    # Skeletal structures from a pasted SMILES (core/chem.py). A core
    # dependency: without it, pasting one on a fresh install did nothing
    # visible. A session with a structure opens without it all the same.
    "rdkit",
]

[project.optional-dependencies]
test = ["pytest"]
# Kept so `pip install .[structures]` still works; RDKit is a dependency.
structures = ["rdkit"]

# Two entry points on purpose. The console one prints (a version check, a
# reader warning, the NO MOLAR MASS notice on an export); the windowed one is
# what a Start Menu shortcut points at, so no console flashes up behind the
# window. Both run the same main().
#
# The NAMES are deliberately in one place only: `dscpanel.branding`. A rename
# changes that module, these two lines, and nothing else - see
# `dscpanel.branding.LEGACY_NAMES` for how the old name is cleaned up.
[project.scripts]
triplot = "dscpanel.__main__:main"

[project.gui-scripts]
triplot-gui = "dscpanel.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "dscpanel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dscpanel.resources" = ["*.svg", "*.png", "*.ico"]
